<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h3 class="mb-3">Enter OTP</h3>
                <p class="text-muted">We've sent a 4-digit code to your email.</p>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <input type="text" name="otp" maxlength="4" class="form-control mb-3" placeholder="Enter 4-digit OTP" required autofocus>
                    <button type="submit" class="btn btn-primary w-100">Verify OTP</button>
                </form>

                <a href="{{ url_for('auth.login') }}" class="d-block text-center mt-3">Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
