{% extends 'base.html' %}

{% block title %}Login - Library Management System{% endblock %}

{% block content %}
<div style="display:flex;justify-content:center;align-items:center;min-height:80vh;padding:20px;">
    <div style="width:100%;max-width:450px;background:white;padding:30px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.12);">
        <h2 style="text-align:center;margin-bottom:20px;color:#2c3e50;">Library Login</h2>
        <form method="post" action="{{ url_for('auth.login') }}">
            <div style="margin-bottom:12px;">
                <label for="email" style="display:block;margin-bottom:6px;font-weight:600;">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;">
            </div>
            <div style="margin-bottom:16px;">
                <label for="password" style="display:block;margin-bottom:6px;font-weight:600;">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;">
            </div>
            <button type="submit" style="width:100%;padding:12px;background:#198754;color:white;border:none;font-size:16px;font-weight:600;cursor:pointer;border-radius:8px;">Login</button>
        </form>
        <p style="margin-top:15px;text-align:center;">
            Not registered?
            <a href="{{ url_for('auth.register') }}" style="text-decoration:none;color:#0d6efd;">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
