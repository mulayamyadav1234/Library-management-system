{% extends 'base.html' %}

{% block title %}Student Registration - Library Management System{% endblock %}

{% block content %}
<div style="display:flex;justify-content:center;align-items:center;min-height:80vh;padding:20px;">
    <div style="width:100%;max-width:500px;background:white;padding:30px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.12);">
        <h2 style="text-align:center;margin-bottom:20px;color:#2c3e50;">&#129489;Student Registration</h2>

        {% if error %}
        <p style="color:#dc3545;margin-bottom:12px;">{{ error }}</p>
        {% endif %}
        {% if success %}
        <p style="color:#198754;margin-bottom:12px;">{{ success }}</p>
        {% endif %}

        <form action="{{ url_for('auth.register') }}" method="POST">
        
            <div style="margin-bottom:12px;">
                <label style="display:block;margin-bottom:6px;font-weight:600;">Student Name :</label>
                <input type="text" name="name" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;">
            </div>

            <div style="margin-bottom:12px;">
                <label style="display:block;margin-bottom:6px;font-weight:600;">Email :</label>
                <input type="email" name="email" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;">
            </div>

            <div style="margin-bottom:12px;">
                <label style="display:block;margin-bottom:6px;font-weight:600;">Phone Number :</label>
                <input type="text" name="phone" maxlength="10" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;">
            </div>

            <div style="margin-bottom:12px;">
                <label style="display:block;margin-bottom:6px;font-weight:600;">Department :</label>
                <select name="department" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;">
                    <option value="">--Select Department--</option>
                    <option>CSE</option>
                    <option>IT</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                </select>
            </div>
<!--
            <div style="margin-bottom:12px;">
                <label style="display:block;margin-bottom:6px;font-weight:600;">Date of Birth :</label>
                <input type="date" name="dob" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;">
            </div>
-->
            <div style="margin-bottom:16px;">
                <label style="display:block;margin-bottom:6px;font-weight:600;">Password :</label>
                <input type="password" name="password" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;">
            </div>

            <button type="submit" style="width:100%;padding:12px;background:#198754;color:white;border:none;font-size:16px;font-weight:600;cursor:pointer;border-radius:8px;">
                Register
            </button>
        </form>
    </div>
</div>
{% endblock %}
